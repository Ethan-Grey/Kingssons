.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,5vw,64px);align-items:center;padding-top:clamp(40px,7vw,96px);padding-bottom:clamp(48px,7vw,96px)}

.cyc button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:99px;padding:6px 14px;cursor:pointer;font:600 .85rem var(--body)}

/* switcher */
.switch{background:var(--char);border-top:1px solid rgba(255,255,255,.08);overflow-x:auto}
.switch .wrap{display:flex;gap:8px;padding-top:14px;padding-bottom:14px;width:max-content;min-width:100%}

.card:nth-child(even){border-radius:26px 26px 6px 26px}
.card svg.bg{position:absolute;inset:0;width:100%;height:100%;z-index:-2;transition:transform .6s var(--ease)}

.card::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(0,0,0,.92) 8%,rgba(0,0,0,.35) 60%,rgba(0,0,0,0))}
.card h3{font-size:1.6rem;margin:.5em 0 .3em}

.card .links{display:flex;gap:16px;flex-wrap:wrap;font-weight:700}
.card .links a{color:var(--a-lit)}
.span7{grid-column:span 7}.span5{grid-column:span 5}.span4{grid-column:span 4}.span6{grid-column:span 6}.span12{grid-column:span 12}
.card.wide{min-height:200px}
@media(max-width:900px){.bento>*{grid-column:span 12!important}.card{min-height:300px}}
/* generic blocks */
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,72px);align-items:start}

.offers{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 40px}

@media(max-width:760px){.offers{grid-template-columns:1fr}}
.panel{border-radius:24px;padding:clamp(22px,3vw,36px);background:var(--char);color:#fff;border-left:6px solid var(--a)}

.panel h3{margin-bottom:.4em}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;counter-reset:s;list-style:none;margin:40px 0 0;padding:0}
.steps li{counter-increment:s;padding:8px 28px 8px 0;position:relative}
.steps li::before{content:counter(s);display:block;font:900 5rem/1 var(--display);font-stretch:125%;color:var(--a-deep);margin-bottom:8px}
@media(max-width:760px){.steps{grid-template-columns:1fr}}
.values{display:grid;grid-template-columns:repeat(2,1fr);gap:28px 40px;margin-top:8px}

/* before/after */
.ba{position:relative;aspect-ratio:16/10;border-radius:26px 26px 26px 6px;overflow:hidden;background:#000;--p:50}
.ba .l{position:absolute;inset:0}.ba .l svg{width:100%;height:100%}
.ba .b svg{filter:grayscale(1) brightness(.55) contrast(.9)}

.ba .hd{position:absolute;top:0;bottom:0;left:calc(var(--p)*1%);width:3px;background:#fff;z-index:3;pointer-events:none}
.ba .hd::after{content:"\2194";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:var(--a);color:var(--a-on);display:grid;place-items:center;font-size:1.2rem}
.ba input:focus-visible~.hd::after{outline:3px solid #fff;outline-offset:2px}
.ba .tag{position:absolute;top:14px;z-index:3;background:rgba(0,0,0,.7);color:#fff;font:700 .78rem var(--body);padding:4px 12px;border-radius:99px}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}

.filters button[aria-pressed=true]{background:var(--fg);color:var(--bg)}

.formbox{background:#fff;color:#0a0a0a;border-radius:28px 28px 28px 6px;padding:clamp(22px,3.5vw,40px);box-shadow:0 30px 60px -30px rgba(0,0,0,.5);border-top:8px solid var(--a)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}

.checks{display:flex;flex-wrap:wrap;gap:8px 18px}

.draft{border:1px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:.9rem;color:var(--muted);margin-bottom:28px}
.prose h2{font-size:1.5rem;margin-top:1.6em}.prose{max-width:70ch}

footer{background:var(--ink);color:#fff;padding:64px 0 40px;border-top:1px solid #222}
footer .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:36px}

 else if(raw==='/services'){view=pgServices();tone='dark';title='Our Services | Kingssons';desc='Explore every Kingssons service: car detailing, lawn mowing, gardening, green waste removal, rubbish removal, end-of-tenancy cleaning and water blasting.';}
 else if(p[0]==='services'&&SBY[p[1]]){const s=SBY[p[1]];view=pgService(s);theme=s.theme;tone=s.tone;title=s.name.replace('&','and')+' | Kingssons';desc=s.meta;}
 else if(raw==='/about'){view=pgAbout();title='About Us | Kingssons';desc='Kingssons is a family-owned business helping customers look after their vehicles, homes, gardens and properties in New Zealand.';}
 else if(raw==='/gallery'){view=pgGallery();title='Gallery | Kingssons';desc='Kingssons job gallery with before-and-after comparisons.';}
 else if(raw==='/service-areas'){view=pgAreas();title='Service Areas | Kingssons';desc='Where Kingssons provides property services in New Zealand.';}
 else if(raw==='/faqs'){view=pgFaqs();title='FAQs | Kingssons';desc='Answers to common questions about Kingssons services, quotes and photos.';}
 else if(raw==='/contact'){view=pgContact();title='Contact | Kingssons';desc='Contact Kingssons or request a free quote.';}
 else if(p[0]==='quote'){view=pgQuote(p[1]);theme=T(p[1]);title='Get a Free Quote | Kingssons';desc='Request a free quote from Kingssons for property services in New Zealand.';}
 else if(raw==='/privacy'){view=pgLegal('privacy');title='Privacy Policy | Kingssons';}
 else if(raw==='/terms'){view=pgLegal('terms');title='Terms and Conditions | Kingssons';}
 else{view=pg404();title='Page not found | Kingssons';}
 setTheme(theme);header(raw,tone);footer();
 main.innerHTML=view;main.classList.remove('in');void main.offsetWidth;main.classList.add('in');
 document.title=title;document.querySelector('meta[name=description]').content=desc;
 ['og:title','og:description'].forEach((k,i)=>{const m=document.querySelector(`meta[property="${k}"]`);if(m)m.content=i?desc:title});
 closeDrawer();window.scrollTo(0,0);main.focus({preventScroll:true});
 if(raw==='/')startCycle();
 const sdiv=p[0]==='services'?SBY[p[1]]:null;
 if(sdiv&&location.hash.includes('#quote')){}
}
function startCycle(){
 cycI=0;const labels=CYCLE.map(k=>SBY[k].name),layers=[...document.querySelectorAll('.art .layer')],cl=document.getElementById('cycl'),hero=document.getElementById('hero');
 const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
 const tick=()=>{if(cycPaused||document.hidden||curRoute!=='/')return;cycI=(cycI+1)%CYCLE.length;
  setTheme(T(CYCLE[cycI]));hero.className='hero on-dark';layers.forEach((l,i)=>l.classList.toggle('on',i===cycI));cl.textContent=labels[cycI]};
 if(reduce){cycPaused=true;const b=document.getElementById('cycb');b.textContent='Colour change paused';b.setAttribute('aria-pressed','true');b.disabled=true;return}
 cycTimer=setInterval(tick,2800);
}

/* ---------- Events ---------- */
const drawer=document.getElementById('drawer');
function openDrawer(){drawer.classList.add('open');drawer.removeAttribute('aria-hidden');document.body.style.overflow='hidden';document.getElementById('burger').setAttribute('aria-expanded','true');document.getElementById('dclose').focus()}
function closeDrawer(){drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');document.body.style.overflow='';const b=document.getElementById('burger');if(b)b.setAttribute('aria-expanded','false')}
function closeDD(){const b=document.getElementById('ddb'),d=document.getElementById('dd');if(d&&!d.hidden){d.hidden=true;b.setAttribute('aria-expanded','false')}}
document.addEventListener('click',e=>{
 const t=e.target;
 if(t.closest('#burger'))return openDrawer();
 if(t.closest('#dclose'))return closeDrawer();
 if(t.closest('#drawer a'))closeDrawer();
 const ddb=t.closest('#ddb');
 if(ddb){const d=document.getElementById('dd');d.hidden=!d.hidden;ddb.setAttribute('aria-expanded',String(!d.hidden));return}
 if(!t.closest('.ddw'))closeDD(); else if(t.closest('#dd a'))closeDD();
 if(t.id==='cycb'){cycPaused=!cycPaused;t.setAttribute('aria-pressed',String(cycPaused));t.textContent=cycPaused?'Resume colour change':'Pause colour change'}
 const f=t.closest('[data-flt]');
 if(f){document.querySelectorAll('[data-flt]').forEach(b=>b.setAttribute('aria-pressed',String(b===f)));document.querySelectorAll('#gal figure').forEach(fg=>fg.hidden=!(f.dataset.flt==='all'||fg.dataset.s===f.dataset.flt))}
 if(t.id==='copyq'){navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('qtext').textContent).then(()=>{t.textContent='Copied'}).catch(()=>{})}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDD();closeDrawer()}});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.matches('.ba input'))t.closest('.ba').style.setProperty('--p',t.value);
 const f=t.closest('.fld');if(f&&f.classList.contains('bad')){f.classList.remove('bad');const er=f.querySelector('.err');if(er)er.textContent=''}
});
document.addEventListener('change',e=>{
 if(e.target.id==='f_service'){const slug=e.target.value;document.getElementById('svcFields').innerHTML=svcFields(slug);setTheme(T(slug));
  if(location.hash.startsWith('#/quote'))history.replaceState(null,'','#/quote'+(slug?'/'+slug:''))}
});
document.addEventListener('submit',async e=>{
 const form=e.target.closest('#qf');if(!form)return;e.preventDefault();
 const mode=form.dataset.mode,st=document.getElementById('qstatus');st.innerHTML='';
 form.querySelectorAll('.fld').forEach(f=>{f.classList.remove('bad');const er=f.querySelector('.err');if(er)er.textContent=''});
 const fd=new FormData(form);
 if(fd.get('website'))return; // honeypot
 const bad=[],mark=(n,msg,id)=>{const f=form.querySelector(`[data-f="${n}"]`);if(f){f.classList.add('bad');f.querySelector('.err').textContent=msg}bad.push(id||('f_'+n))};
 if(mode==='quote'&&!fd.get('service'))mark('service','Select the service you need.');
 if(!String(fd.get('name')||'').trim())mark('name','Enter your name.');
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(fd.get('email')||'').trim()))mark('email','Enter a valid email address, like name@example.com.');
 if(mode==='quote'&&String(fd.get('phone')||'').replace(/\D/g,'').length<7)mark('phone','Enter a phone number with at least 7 digits.');
 if(mode==='quote'&&!String(fd.get('location')||'').trim())mark('location','Enter your suburb or property address.');
 const svc=SBY[fd.get('service')];
 if(svc)svc.fields.filter(f=>f.req&&!String(fd.get(f.n)||'').trim()).forEach(f=>mark(f.n,'This field is required.'));
 if(!String(fd.get('desc')||'').trim())mark('desc','Tell us a little about the job.');
 if(!fd.get('consent'))mark('consent','Please tick to agree before sending.');
 if(bad.length){st.innerHTML=`<div class="status error" role="alert">Please fix ${bad.length} field${bad.length>1?'s':''} above before sending.</div>`;const el=document.getElementById(bad[0])||form.querySelector('.bad input,.bad select,.bad textarea');el&&el.focus();return}
 const lines=[mode==='quote'?`Quote request: ${svc?svc.name:'General'}`:'Website message'];
 const add=(l,v)=>{v=String(v||'').trim();if(v)lines.push(`${l}: ${v}`)};
 add('Name',fd.get('name'));add('Email',fd.get('email'));add('Phone',fd.get('phone'));add('Location',fd.get('location'));
 if(svc)svc.fields.forEach(f=>add(f.l,f.t==='checks'?fd.getAll(f.n).join(', '):fd.get(f.n)));
 add(mode==='quote'?'Job description':'Message',fd.get('desc'));add('Preferred date / timeframe',fd.get('when'));
 const text=lines.join('\n'),subject=mode==='quote'?`Quote request: ${svc.name}`:'Message from website';
 const btn=form.querySelector('button[type=submit]');
 const fallback=(msg)=>`<div class="status" role="status"><b>${msg}</b><pre id="qtext">${esc(text)}</pre><button type="button" class="btn sm" id="copyq">Copy request</button></div>`;
 if(CONFIG.formEndpoint){
  btn.disabled=true;btn.textContent='Sending…';
  try{const r=await fetch(CONFIG.formEndpoint,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({subject,message:text,service:svc?svc.name:'General',name:fd.get('name'),email:fd.get('email'),phone:fd.get('phone')})});
   if(!r.ok)throw new Error(r.status);
   st.innerHTML=`<div class="status ok" role="status"><b>Request received.</b> Thanks, ${esc(String(fd.get('name')).split(' ')[0])}. We will reply to ${esc(fd.get('email'))}.</div>`;form.reset();
  }catch(err){st.innerHTML=`<div class="status error" role="alert"><b>Your request has not been sent.</b> Something went wrong sending it.${CONFIG.email?' Try again, or email us directly at '+esc(CONFIG.email)+'.':' Please try again shortly.'}</div>`+fallback('Your details (copy them so you do not lose them):')}
  btn.disabled=false;btn.textContent=mode==='quote'?'Send quote request':'Send message';return;
 }
 if(CONFIG.email){
  st.innerHTML=fallback('Your email app should now open with this request filled in. Your request has not been sent until you press Send in that email. Attach any photos there.');
  window.location.href=`mailto:${CONFIG.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;return;
 }
 st.innerHTML=`<div class="status error" role="alert"><b>Your request has not been sent.</b> Online quote requests are not switched on for this site yet. You can copy your details below.</div>`+fallback('Your request:');
});
addEventListener('hashchange',render);
document.addEventListener('visibilitychange',()=>{});

/* Structured data (only confirmed details are included) */
(function(){
 const d={'@context':'https://schema.org','@type':'LocalBusiness','name':'Kingssons','description':'Family-owned property services business in New Zealand.','address':{'@type':'PostalAddress','addressCountry':'NZ'},
  'hasOfferCatalog':{'@type':'OfferCatalog','name':'Services','itemListElement':SERVICES.filter(s=>s.slug!=='other-services').map(s=>({'@type':'Offer','itemOffered':{'@type':'Service','name':s.name,'description':s.short}}))}};
 if(CONFIG.phone)d.telephone=CONFIG.phone;if(CONFIG.email)d.email=CONFIG.email;if(CONFIG.areas.length)d.areaServed=CONFIG.areas;
 const s=document.createElement('script');s.type='application/ld+json';s.textContent=JSON.stringify(d);document.head.appendChild(s);
})();
render();
</script>
